<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃板材查詢系統 (支援雙指放大)</title>
    
    <!-- 引入 Viewer.js 圖片放大套件的 CSS -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; padding: 10px; }
        
        h1 { font-size: 1.3rem; text-align: center; margin: 10px 0 15px 0; }
        
        /* 搜尋與控制區 */
        .search-container { background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .search-input { padding: 12px; width: 100%; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; -webkit-appearance: none; }
        
        /* 分類按鈕區 */
        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 8px 14px; border: 1px solid #ddd; background: #fff; border-radius: 20px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; transition: 0.2s; }
        .filter-btn.active { background: #007bff; color: #fff; border-color: #007bff; }

        /* 主容器 */
        .container { display: flex; flex-direction: column; gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        /* 右側預覽面板（手機置頂） */
        .preview-panel { width: 100%; background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; position: sticky; top: 0; z-index: 100; }
        .preview-panel h2 { font-size: 1rem; margin-bottom: 2px; }
        
        /* 櫃體模擬區域 */
        .cabinet-mockup { 
            width: 100%; 
            height: 180px; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            color: #fff; 
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            margin-top: 8px; 
            border: 1px solid #ddd; 
            cursor: zoom-in;
            position: relative;
        }
        
        /* 提示小標籤 */
        .zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: normal;
            text-shadow: none;
            pointer-events: none;
        }

        #hiddenTargetImg { display: none; }

        /* 左側清單區 */
        .list-area { width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .no-result { display: none; text-align: center; padding: 30px; color: #999; background: #fff; border-radius: 8px; font-size: 0.9rem; }
        
        .card { background: #fff; padding: 8px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); cursor: pointer; text-align: center; border: 2px solid transparent; transition: 0.1s; }
        .card.active { border-color: #007bff; background-color: #f0f7ff; }
        
        .texture-box { width: 100%; height: 85px; border-radius: 4px; margin-bottom: 6px; background-size: cover; background-position: center; background-repeat: no-repeat; border: 1px solid #eee; }
        .card strong { font-size: 0.9rem; display: block; margin-bottom: 2px; }
        .card small { font-size: 0.75rem; color: #666; display: block; }

        /* 電腦桌機版專用樣式 */
        @media (min-width: 768px) {
            body { padding: 20px; }
            h1 { font-size: 1.5rem; text-align: left; }
            .search-container { flex-direction: row; padding: 15px; }
            .search-input { width: 250px; }
            .container { flex-direction: row; }
            .list-area { width: 60%; }
            .grid { grid-template-columns: repeat(3, 1fr); gap: 15px; }
            .preview-panel { width: 40%; position: sticky; top: 20px; height: fit-content; padding: 20px; }
            .cabinet-mockup { height: 300px; margin-top: 15px; }
            .texture-box { height: 100px; }
            .card strong { font-size: 1rem; }
            .card small { font-size: 0.85rem; }
        }
    </style>

        const grid = document.getElementById('colorGrid');
        const mockupBox = document.getElementById('mockupBox');
        const selectedCode = document.getElementById('selectedCode');
        const selectedName = document.getElementById('selectedName');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const noResult = document.getElementById('noResult');
        const hiddenTargetImg = document.getElementById('hiddenTargetImg');

        let currentCategory = 'all';
        let searchQuery = '';
        let galleryViewer = null;

        function initViewer() {
            if (galleryViewer) {
                galleryViewer.destroy();
            }
            galleryViewer = new Viewer(hiddenTargetImg, {
                inline: false,
                button: true,
                navbar: false,
                title: true,
                toolbar: {
                    zoomIn: 1,
                    zoomOut: 1,
                    oneToOne: 1,
                    reset: 1,
                    rotateLeft: 0,
                    rotateRight: 0,
                    flipHorizontal: 0,
                    flipVertical: 0,
                },
                tooltip: false,
                movable: true,
                zoomable: true,
                transition: true
            });
        }

        function renderTextures() {
            grid.innerHTML = '';
            
            const filteredData = boardTextures.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = item.code.toLowerCase().includes(searchQuery) || 
                                      item.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filteredData.length === 0) {
                noResult.style.display = 'block';
                selectedCode.textContent = '-';
                selectedName.textContent = '-';
                mockupBox.style.backgroundImage = 'none';
                mockupBox.style.pointerEvents = 'none';
                return;
            }
            noResult.style.display = 'none';
            mockupBox.style.pointerEvents = 'auto';

            filteredData.forEach((item) => {
                const card = document.createElement('div');
                card.className = `card`;
                card.id = `card-${item.code.replace(/\s+/g, '-')}`;
                
                card.innerHTML = `
                    <div class="texture-box" style="background-image: url('${item.img}');"></div>
                    <strong>${item.code}</strong>
                    <small>${item.name}</small>
                `;
                card.addEventListener('click', () => selectTexture(item));
                grid.appendChild(card);
            });

            if (filteredData.length > 0) {
                selectTexture(filteredData);
            }
        }

        function selectTexture(item) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            
            const cardId = `card-${item.code.replace(/\s+/g, '-')}`;
            const activeCard = document.getElementById(cardId);
            if (activeCard) activeCard.classList.add('active');
            
            selectedCode.textContent = item.code;
            selectedName.textContent = `品名：${item.name}`;
            mockupBox.style.backgroundImage = `url('${item.img}')`;
            
            hiddenTargetImg.src = item.img;
            hiddenTargetImg.alt = `${item.code} - ${item.name}`;
            
            initViewer();
        }

        mockupBox.addEventListener('click', () => {
            if (galleryViewer && hiddenTargetImg.src) {
                galleryViewer.show();
            }
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTextures();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentCategory = e.target.dataset.category;
                renderTextures();
            });
        });

        renderTextures();
