<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃板材查詢系統 (含新增功能)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 10px;
        }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 15px 0;
        }
        
        h1 {
            font-size: 1.3rem;
        }
        
        .btn-primary {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .btn-primary:active {
            opacity: 0.8;
        }
        
        .search-container {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .search-input {
            padding: 12px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            -webkit-appearance: none;
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .filter-btn {
            padding: 8px 14px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
            transition: 0.2s;
        }
        
        .filter-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .preview-panel {
            width: 100%;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .preview-panel h2 {
            font-size: 1rem;
            margin-bottom: 2px;
        }
        
        .cabinet-mockup {
            width: 100%;
            height: 180px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.8);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 8px;
            border: 1px solid #ddd;
        }
        
        .list-area {
            width: 100%;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .no-result {
            display: none;
            text-align: center;
            padding: 30px;
            color: #999;
            background: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .card {
            background: #fff;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.1s;
        }
        
        .card.active {
            border-color: #007bff;
            background-color: #f0f7ff;
        }
        
        .texture-box {
            width: 100%;
            height: 85px;
            border-radius: 4px;
            margin-bottom: 6px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #eee;
        }
        
        .card strong {
            font-size: 0.9rem;
            display: block;
            margin-bottom: 2px;
        }
        
        .card small {
            font-size: 0.75rem;
            color: #666;
            display: block;
        }

        /* 彈出視窗樣式 (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: bold;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        
        .btn-cancel {
            background: #ccc;
            color: #333;
        }
        
        .btn-submit {
            background: #007bff;
            color: #fff;
        }

        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .search-container {
                flex-direction: row;
                padding: 15px;
            }
            .search-input {
                width: 250px;
            }
            .container {
                flex-direction: row;
            }
            .list-area {
                width: 60%;
            }
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
            .preview-panel {
                width: 40%;
                position: sticky;
                top: 20px;
                height: fit-content;
                padding: 20px;
            }
            .cabinet-mockup {
                height: 300px;
                margin-top: 15px;
            }
            .texture-box {
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <div class="header-bar">
        <h1>系統櫃板材查詢系統</h1>
        <button class="btn-primary" id="openModalBtn">＋ 新增色號</button>
    </div>

    <!-- 搜尋與分類功能區 -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="輸入色號或名稱搜尋...">
        <div class="filter-tabs" id="filterTabs">
            <button class="filter-btn active" data-category="all">全部板材</button>
            <button class="filter-btn" data-category="D2A">D2A區</button>
            <button class="filter-btn" data-category="D2B">D2B區</button>
            <button class="filter-btn" data-category="W8A">W8A區</button>
        </div>
    </div>

    <div class="container">
        <!-- 即時預覽區 -->
        <div class="preview-panel">
            <h2>目前選定：<span id="selectedCode" style="color: #007bff;">-</span></h2>
            <p id="selectedName" style="font-size: 0.85rem; color: #666; margin-top: 2px;">-</p>
            <div class="cabinet-mockup" id="mockupBox">請選擇板材</div>
        </div>

        <!-- 板材清單區 -->
        <div class="list-area">
            <div class="grid" id="colorGrid"></div>
            <div class="no-result" id="noResult">沒有找到符合條件的板材 😭</div>
        </div>
    </div>

    <!-- 新增色號彈出視窗 (Modal) -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>新增板材色號</h3>
            <div class="form-group">
                <label>色號代碼 (例: JM500)</label>
                <input type="text" id="inputCode" placeholder="請輸入色號">
            </div>
            <div class="form-group">
                <label>板材名稱 (例: 摩卡橡木)</label>
                <input type="text" id="inputName" placeholder="請輸入名稱">
            </div>
            <div class="form-group">
                <label>放置區域</label>
                <select id="inputCategory">
                    <option value="D2A">D2A區</option>
                    <option value="D2B">D2B區</option>
                    <option value="W8A">W8A區</option>
                </select>
            </div>
            <div class="form-group">
                <label>圖片路徑/檔名 (例: images/JM500.jpg)</label>
                <input type="text" id="inputImg" placeholder="images/檔名.jpg" value="images/">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeModalBtn">取消</button>
                <button class="btn-submit" id="saveBoardBtn">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        // 原始內建資料庫
        const defaultTextures = [{
            code: 'JM185', name: '冰島白橡', category: 'D2A', img: 'images/JM185.jpg'
        }, {
            code: 'JM202', name: '淺灰', category: 'D2A', img: 'images/JM202.jpg'
        }, {
            code: 'ER206', name: '黑色義大利石板', category: 'D2A', img: 'images/F206.jpg'
        }, {
            code: 'JM287', name: '黑部山', category: 'D2A', img: 'images/JM287.jpg'
        }, {
            code: 'S-909', name: '現代清水模', category: 'W8A', img: 'images/stone1.png'
        }];

        // 從 LocalStorage 載入資料，若無則使用預設資料
        let boardTextures = JSON.parse(localStorage.getItem('boardTextures')) || defaultTextures;

        const grid = document.getElementById('colorGrid');
        const mockupBox = document.getElementById('mockupBox');
        const selectedCode = document.getElementById('selectedCode');
        const selectedName = document.getElementById('selectedName');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const noResult = document.getElementById('noResult');

        // Modal 相關元素
        const addModal = document.getElementById('addModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const saveBoardBtn = document.getElementById('saveBoardBtn');
        const inputCode = document.getElementById('inputCode');
        const inputName = document.getElementById('inputName');
        const inputCategory = document.getElementById('inputCategory');
        const inputImg = document.getElementById('inputImg');

        let currentCategory = 'all';
        let searchQuery = '';

        function renderTextures() {
            grid.innerHTML = '';

            const filteredData = boardTextures.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = item.code.toLowerCase().includes(searchQuery) ||
                    item.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filteredData.length === 0) {
                noResult.style.display = 'block';
                selectedCode.textContent = '-';
                selectedName.textContent = '-';
                mockupBox.style.backgroundImage = 'none';
                mockupBox.textContent = '無符合板材';
                return;
            }
            noResult.style.display = 'none';

            filteredData.forEach((item) => {
                const card = document.createElement('div');
                card.className = `card`;
                card.id = `card-${item.code.replace(/\s+/g, '-')}`;

                card.innerHTML = `
                    <div class="texture-box" style="background-image: url('${item.img}');"></div>
                    <strong>${item.code}</strong>
                    <small>${item.name}</small>
                `;
                card.addEventListener('click', () => selectTexture(item));
                grid.appendChild(card);
            });

            if (filteredData.length > 0) {
                selectTexture(filteredData[0]);
            }
        }

        function selectTexture(item) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const cardId = `card-${item.code.replace(/\s+/g, '-')}`;
            const activeCard = document.getElementById(cardId);
            if (activeCard) activeCard.classList.add('active');

            selectedCode.textContent = item.code;
            selectedName.textContent = `品名：${item.name}`;
            mockupBox.style.backgroundImage = `url('${item.img}')`;
            mockupBox.textContent = item.name;
        }

        // 搜尋與篩選事件
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTextures();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderTextures();
            });
        });

        // 彈出視窗控制
        openModalBtn.addEventListener('click', () => {
            addModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            addModal.style.display = 'none';
        });

        // 儲存新板材
        saveBoardBtn.addEventListener('click', () => {
            const code = inputCode.value.trim();
            const name = inputName.value.trim();
            const category = inputCategory.value;
            const img = inputImg.value.trim() || 'images/default.jpg';

            if (!code || !name) {
                alert('請填寫完整色號與名稱！');
                return;
            }

            // 新增至陣列開頭
            boardTextures.unshift({ code, name, category, img });

            // 存入瀏覽器 LocalStorage
            localStorage.setItem('boardTextures', JSON.stringify(boardTextures));

            // 清空表單並關閉視窗
            inputCode.value = '';
            inputName.value = '';
            inputImg.value = 'images/';
            addModal.style.display = 'none';

            // 重新渲染畫面
            renderTextures();
            alert(`成功新增色號：${code}`);
        });

        renderTextures();
    </script>
</body>

</html>
